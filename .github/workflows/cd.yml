name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy — Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: DEBUG - show pulled env (temporary, remove after diagnosing)
        run: |
          echo "Arquivos em .vercel:"
          ls -la .vercel/ || echo "pasta .vercel nao existe"
          echo "---"
          if [ -f .vercel/.env.production.local ]; then
            echo "Chaves presentes no .env.production.local:"
            grep -o '^VITE_[A-Z_]*' .vercel/.env.production.local
            echo "---"
            echo "Valores (nao sao segredo, vao pro bundle publico de qualquer forma):"
            grep '^VITE_COGNITO_USER_POOL_ID=' .vercel/.env.production.local
            grep '^VITE_COGNITO_CLIENT_ID=' .vercel/.env.production.local
            grep '^VITE_API_BASE_URL=' .vercel/.env.production.local
          else
            echo "ARQUIVO .env.production.local NAO FOI CRIADO — vercel pull nao trouxe nada"
          fi

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
